# Prometheus config for LOCAL verification of the observability stack: the
# api (ROLE=api, PORT=4000) and worker (ROLE=worker, metrics on PORT=4100)
# run as host processes; exporters run as siblings in the compose network.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hookline-api
    static_configs:
      - targets: ['host.docker.internal:4000']
    metrics_path: /metrics

  - job_name: hookline-worker
    static_configs:
      - targets: ['host.docker.internal:4100']
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
