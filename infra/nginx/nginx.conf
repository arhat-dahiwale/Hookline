# Hookline edge (ARCHITECTURE.md section 8, Phase 13).
# Docker DNS re-resolution: proxy_pass uses a VARIABLE so nginx resolves
# `api`/`web` per request (resolver valid=5s) — scaled or killed replicas are
# picked up without a reload.

worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65s;

  resolver 127.0.0.11 valid=5s ipv6=off;

  # Coarse public rate limit (fine-grained per-key limits live in the api).
  limit_req_zone $binary_remote_addr zone=edge:10m rate=200r/s;
  limit_req_status 429;

  # Webhook bodies are capped at 1 MB in the api; match it here.
  client_max_body_size 1m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    set $api_upstream http://api:4000;
    set $web_upstream http://web:3000;

    # --- public API (nginx status codes preserved) ---------------------------
    location /v1/ {
      limit_req zone=edge burst=400 nodelay;
      proxy_pass $api_upstream;
      include /etc/nginx/proxy_common.conf;
    }

    # --- dashboard typed API ---------------------------------------------------
    location /trpc/ {
      proxy_pass $api_upstream;
      include /etc/nginx/proxy_common.conf;
    }

    # --- Better Auth (sign in/up, org switching) ------------------------------
    location /api/auth/ {
      proxy_pass $api_upstream;
      include /etc/nginx/proxy_common.conf;
    }

    # --- health probes (for external checks; /metrics stays private) ----------
    location /health/ {
      proxy_pass $api_upstream;
      include /etc/nginx/proxy_common.conf;
    }

    # Prometheus scrape endpoints must NOT be public.
    location /metrics {
      return 404;
    }

    # --- realtime: WebSocket upgrade with a long read timeout -----------------
    location /ws {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      # Server pings every 25s; 3 missed beats is a dead connection.
      proxy_intercept_errors off;
    }

    # --- dashboard (Next.js) ---------------------------------------------------
    location / {
      proxy_pass $web_upstream;
      include /etc/nginx/proxy_common.conf;
    }
  }

  # Optional TLS (mount certs + enable by including this server):
  # server {
  #   listen 443 ssl;
  #   ssl_certificate     /etc/nginx/certs/tls.crt;
  #   ssl_certificate_key /etc/nginx/certs/tls.key;
  #   ... same locations as above ...
  # }
}
