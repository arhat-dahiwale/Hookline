# OpenTelemetry Collector configuration (Hookline demo topology).
# Receives OTLP traces from the api/worker roles, exports to Tempo (traces)
# and logs to stdout for local debugging. Metrics come from Prometheus
# scraping the services directly.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, debug]
