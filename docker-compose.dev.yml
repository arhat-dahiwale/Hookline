# Local development dependencies only (Postgres + Redis).
# The app runs on the host with `pnpm dev`. Full topology: docker-compose.yml (Phase 13).
name: hookline

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hookline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-hookline}
    ports:
      # Host port differs from the container port: native postgres.exe and a
      # WSL redis relay already own 5432/6379 on this dev machine.
      - '${POSTGRES_PORT:-15432}:5432'
    volumes:
      - hookline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hookline} -d ${POSTGRES_DB:-hookline}']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    # AOF on so queued jobs survive a Redis restart (PRD section 11).
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-16379}:6379'
    volumes:
      - hookline-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  hookline-pgdata:
  hookline-redisdata:
