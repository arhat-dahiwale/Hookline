# Playwright E2E (dashboard journey). The suite boots the real API (built
# dist, ROLE=all) and the Next.js dev server against the dev compose
# Postgres/Redis. CI has no .env (git-ignored), so a dev one is generated
# first with crypto-random secrets (scripts/generate-dev-env.mjs) — the app
# refuses to boot without validated config.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Generate dev .env (compose + app config; secrets via node:crypto)
        run: node scripts/generate-dev-env.mjs
      - name: Start dev dependencies (postgres + redis)
        run: docker compose -f docker-compose.dev.yml up -d --wait
      - run: pnpm db:migrate
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
        env:
          ALLOW_INSECURE_ENDPOINTS: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
