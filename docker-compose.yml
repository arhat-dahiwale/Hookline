# Hookline full demo topology (Phase 13): nginx edge, scalable api/worker
# roles, Next.js dashboard, Postgres + Redis (AOF), one-shot migrate, and the
# observability stack. Run from the repo root:
#
#   docker compose up --build -d --scale api=3 --scale worker=2
#
# api/worker deliberately have NO container_name and NO fixed host ports:
# Docker DNS round-robins `api`/`worker` across replicas and nginx
# re-resolves per request. Secrets come from the repo-root .env.
#
# NOTE: this file shares the `hookline` project with docker-compose.dev.yml
# (same postgres/redis services + volumes), so bring the dev compose down
# (named volumes are kept) before starting the full topology.
name: hookline

x-server-env: &server-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-hookline}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-hookline}
  REDIS_URL: redis://redis:6379
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  # Public origin (through nginx) — Better Auth validates Origin headers.
  BETTER_AUTH_URL: http://localhost:8080
  AUTH_TRUSTED_ORIGINS: http://localhost:8080
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  INTERNAL_GRPC_TOKEN: ${INTERNAL_GRPC_TOKEN}
  # DEMO-ONLY: the chaos/load test targets the in-network receiver over http;
  # anywhere real this MUST be false (SSRF protections stay fully on).
  ALLOW_INSECURE_ENDPOINTS: 'true'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  # Metrics reach Prometheus via /metrics scraping; OTLP carries TRACES only.
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SHUTDOWN_TIMEOUT_MS: '15000'

services:
  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.server
    environment:
      <<: *server-env
      ROLE: all
    command: ['node', 'dist/migrate.js']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - com.docker.compose.service-group=hookline-app

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.server
    environment:
      <<: *server-env
      ROLE: api
      PORT: '4000'
      OTEL_SERVICE_NAME: hookline-api
      # Worker gRPC via Docker DNS (any worker replica).
      WORKER_GRPC_URL: dns:///worker:50051
    expose:
      - '4000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:4000/health/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.server
    environment:
      <<: *server-env
      ROLE: worker
      # Worker metrics server binds PORT (standalone /metrics HTTP server).
      PORT: '4100'
      GRPC_PORT: '50051'
      OTEL_SERVICE_NAME: hookline-worker
      DELIVERY_CONCURRENCY: '10'
    expose:
      - '4100'
      - '50051'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:4100/metrics'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NODE_ENV: production
      PORT: '3000'
      # Server-side fetches go straight to an api replica.
      API_ORIGIN: http://api:4000
      # Browsers hit the WebSocket through nginx (same origin, cookies flow).
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    expose:
      - '3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/proxy_common.conf:/etc/nginx/proxy_common.conf:ro
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # In-network webhook receiver for the load/chaos demo: answers 200 to every
  # POST. Delivery rows in Postgres are the source of truth for verification.
  receiver:
    image: node:24-alpine
    command:
      - node
      - '-e'
      - >-
        require('http').createServer((req, res) => {
        res.writeHead(200, { 'content-type': 'application/json' });
        res.end(JSON.stringify({ ok: true }));
        }).listen(9999)
    expose:
      - '9999'
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hookline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-hookline}
    volumes:
      - hookline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-hookline} -d ${POSTGRES_DB:-hookline}']
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:8-alpine
    # AOF on so queued jobs survive a Redis restart (PRD section 11).
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - hookline-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # --- observability (canonical config: scrapes api:4000 / worker:4100) -------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.0
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ./infra/tempo.yaml:/etc/tempo/tempo.yaml:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - '9090:9090'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.0
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-hookline}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-hookline}?sslmode=disable
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.71.0
    environment:
      REDIS_ADDR: redis://redis:6379
    restart: unless-stopped

volumes:
  hookline-pgdata:
  hookline-redisdata:
